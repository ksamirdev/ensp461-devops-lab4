# The blue environment: a complete, independent copy of the app running release 4.0.0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-stats-blue
  namespace: bluegreen
spec:
  replicas: 3
  selector:
    matchLabels: {app: text-stats, color: blue}
  template:
    metadata:
      labels: {app: text-stats, color: blue}
    spec:
      containers:
        - name: app
          image: ghcr.io/ksamirdev/ensp461-devops-lab4:4.0.0
          env:
            - {name: COLOR, value: blue}
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 5000}
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 64Mi}
