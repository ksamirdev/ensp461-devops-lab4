# Credentials for the text-stats namespace. Values live in Vault; External Secrets copies them into
# Kubernetes Secrets and re-reads Vault every minute, so a rotation in Vault reaches the cluster without a commit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: textstats-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: textstats
          serviceAccountRef:
            name: textstats-secrets
            # token is only valid for Vault
            audiences: [vault]
---
# Database login for the "textstats" role; CloudNativePG keeps the role's password in sync with it
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: textstats-db-credentials
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: vault}
  target:
    name: textstats-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef: {key: textstats/db, property: username}
    - secretKey: password
      remoteRef: {key: textstats/db, property: password}
---
# Connection string for the app, built from the same Vault entry
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: textstats-database-url
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: vault}
  target:
    name: textstats-database-url
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@textstats-db-rw:5432/textstats"
  data:
    - secretKey: username
      remoteRef: {key: textstats/db, property: username}
    - secretKey: password
      remoteRef: {key: textstats/db, property: password}
---
# Object-store keys the database uses to ship base backups and WAL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: textstats-backup-s3
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: vault}
  target:
    name: textstats-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: backup/pg-backup, property: access_key}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: backup/pg-backup, property: secret_key}
