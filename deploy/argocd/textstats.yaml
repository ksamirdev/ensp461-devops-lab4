# Argo CD watches deploy/gitops on main and keeps the textstats namespace identical to it:
# new commits are applied automatically, manual changes are reverted (selfHeal) and
# resources deleted from Git are deleted from the cluster (prune).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: textstats
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ksamirdev/ensp461-devops-lab4.git
    targetRevision: main
    path: deploy/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: textstats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
