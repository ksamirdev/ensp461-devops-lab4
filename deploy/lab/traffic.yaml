# Synthetic users for the lab: a steady stream of POST /stats through the user-facing Service,
# so canary analysis and the backup/restore exercises have real requests and rows to measure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: textstats
spec:
  replicas: 2
  selector:
    matchLabels: {app: traffic}
  template:
    metadata:
      labels: {app: traffic}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          command: [sh, -c]
          args:
            - |
              while true; do
                curl -s -o /dev/null -m 2 -X POST -H 'Content-Type: application/json' \
                  -d '{"text":"synthetic user traffic for the lab"}' http://text-stats/stats
                sleep 0.1
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
